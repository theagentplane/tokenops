name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: no job gets more than read access to the repository contents.
permissions: {}

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
      - run: python -m ruff check src tests examples
      - run: python -m ruff format --check src tests examples

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # tests/contract run against the released control plane 1.x from PyPI (the
          # `contract` extra), in process on SQLite.
          python -m pip install -e ".[contract]" --group dev
      - name: Mypy
        # Match the matrix interpreter: with python_version=3.10, mypy cannot parse
        # NumPy 2.x stubs that use `type` statements installed on 3.12+ runners.
        run: python -m mypy --python-version "${{ matrix.python-version }}"
      - name: Pytest
        run: python -m pytest -q

  build:
    name: Build and check the distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Wheel contents
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          assert any(n.endswith("tokenops/config/default.yaml") for n in names), "default.yaml missing"
          assert any(n.endswith("tokenops/py.typed") for n in names), "py.typed missing"
          assert not any(n.startswith(("tests/", "benchmarking/", "examples/")) for n in names), "non-package files shipped"
          print(f"ok: {len(names)} files")
          PY
