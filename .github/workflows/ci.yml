name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # agentplane-control-plane 0.2.0 isn't on PyPI yet — install straight from
          # the repo. The suite runs against a real in-process plane (no fake), and
          # tokenops has no embedded ledger to fall back to (tokenops#118), so this is
          # load-bearing, not optional coverage.
          python -m pip install "agentplane-control-plane @ git+https://github.com/theagentplane/control-plane@main"
          python -m pip install -e ".[dev,contract]"

      - name: Ruff check
        run: python -m ruff check src tests examples

      - name: Ruff format
        run: python -m ruff format --check src tests examples

      - name: Mypy
        # Match the matrix interpreter: with python_version=3.10, mypy cannot parse
        # NumPy 2.x stubs that use `type` statements installed on 3.12 runners.
        run: python -m mypy --python-version "${{ matrix.python-version }}"

      - name: Pytest
        run: python -m pytest -q

  # Does the installed control plane keep every field this SDK sends? Not a gate: a
  # failure here means the plane is older than / has diverged from the SDK, which is
  # worth knowing but must not block an SDK change. `continue-on-error` keeps the
  # workflow green while the job (and its step summary) still shows the failing fields.
  schema-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # oldest plane the SDK claims to support (pyproject: >=0.2.0), and current main
        plane_ref: ["v0.2.0", "main"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "agentplane-control-plane @ git+https://github.com/theagentplane/control-plane@${{ matrix.plane_ref }}"
          python -m pip install -e ".[dev]"

      - name: Wire-schema compatibility
        run: |
          set -o pipefail
          python -m pytest -q -m compat tests/compat -rf --tb=line | tee compat.txt
          status=${PIPESTATUS[0]}
          {
            echo "### Wire-schema compat vs control-plane \`${{ matrix.plane_ref }}\`"
            echo '```'
            grep -E "^(FAILED|[0-9]+ (passed|failed))|passed|failed" compat.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
