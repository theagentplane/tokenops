name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: no job gets more than read access to the repository contents.
permissions: {}

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
      - run: python -m ruff check src tests examples
      - run: python -m ruff format --check src tests examples

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The contract and end-to-end tests run against a real control plane (the
          # `contract` extra, pinned below 1.0 until the 1.0 rework lands).
          python -m pip install -e ".[contract]" --group dev
      - name: Mypy
        # Match the matrix interpreter: with python_version=3.10, mypy cannot parse
        # NumPy 2.x stubs that use `type` statements installed on 3.12+ runners.
        run: python -m mypy --python-version "${{ matrix.python-version }}"
      - name: Pytest
        run: python -m pytest -q

  build:
    name: Build and check the distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Wheel contents
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          assert any(n.endswith("tokenops/config/default.yaml") for n in names), "default.yaml missing"
          assert not any(n.startswith(("tests/", "benchmarking/", "examples/")) for n in names), "non-package files shipped"
          print(f"ok: {len(names)} files")
          PY
