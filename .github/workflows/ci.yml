name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # agentplane-control-plane 0.2.0 isn't on PyPI yet — install straight from
          # the repo so the [contract] tests (real control-plane, not just the fake)
          # actually run in CI instead of silently skipping. tokenops has no embedded
          # ledger to fall back to (tokenops#118), so these are load-bearing, not
          # optional coverage.
          python -m pip install "agentplane-control-plane @ git+https://github.com/theagentplane/control-plane@main"
          python -m pip install -e ".[dev,contract]"

      - name: Ruff check
        run: python -m ruff check src tests examples

      - name: Ruff format
        run: python -m ruff format --check src tests examples

      - name: Mypy
        # Match the matrix interpreter: with python_version=3.10, mypy cannot parse
        # NumPy 2.x stubs that use `type` statements installed on 3.12 runners.
        run: python -m mypy --python-version "${{ matrix.python-version }}"

      - name: Pytest
        run: python -m pytest -q
