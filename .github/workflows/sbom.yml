name: sbom

# Builds the wheel, installs it into a clean virtualenv, and records what pip
# actually resolved as a CycloneDX SBOM. Runs on every PR so the generation is
# proven before it is wired into the release workflow. The file is uploaded as a
# build artifact; it is not committed (it describes one build on one day).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # reused by release.yml so the released SBOM is built by these exact steps

permissions:
  contents: read

jobs:
  sbom:
    name: sbom
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build==1.6.1"
          python -m build --wheel --outdir dist

      - name: Install the wheel into a clean virtualenv
        run: |
          # --without-pip keeps pip itself out of the SBOM; it is tooling, not a
          # dependency. The runner's pip installs into the env via --python.
          python -m venv --without-pip "$RUNNER_TEMP/sbom-env"
          python -m pip --python "$RUNNER_TEMP/sbom-env/bin/python" install dist/*.whl

      - name: Generate CycloneDX SBOM
        run: |
          python -m pip install "cyclonedx-bom==7.5.0"
          python -m cyclonedx_py environment "$RUNNER_TEMP/sbom-env/bin/python" \
            --pyproject pyproject.toml \
            --mc-type library \
            --spec-version 1.6 \
            --output-format JSON \
            --validate \
            --output-file sbom.cdx.json

      - name: Set the root component version from the installed wheel
        run: |
          # pyproject.toml has a dynamic version (src/tokenops/_version.py), so
          # cyclonedx-py cannot read one from it. Take it from the wheel that was
          # installed into the clean environment instead, so the SBOM and the
          # release verify the same thing.
          VERSION="$("$RUNNER_TEMP/sbom-env/bin/python" -c "import importlib.metadata as m; print(m.version('agent-tokenops'))")"
          VERSION="$VERSION" python - <<'PY'
          import json, os

          path = "sbom.cdx.json"
          doc = json.load(open(path))
          root = doc["metadata"]["component"]
          root["version"] = os.environ["VERSION"]
          json.dump(doc, open(path, "w"), indent=2)
          print(f"root component: {root['name']} {root['version']}")
          PY

      - name: Summarize
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json

          doc = json.load(open("sbom.cdx.json"))
          comps = doc["components"]
          root = doc["metadata"]["component"]
          print(f"### SBOM: {root['name']} {root.get('version', '')}")
          print(f"{len(comps)} components, CycloneDX {doc['specVersion']}\n")
          print("| Package | Version | License |")
          print("|---|---|---|")
          for c in sorted(comps, key=lambda c: c["name"].lower()):
              lic = []
              for entry in c.get("licenses", []):
                  lic_obj = entry.get("license", {})
                  lic.append(lic_obj.get("id") or lic_obj.get("name") or entry.get("expression", ""))
              print(f"| {c['name']} | {c['version']} | {' / '.join(lic) or 'NONE'} |")
          PY

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error
