name: PR size

# Notification only. Labels a pull request `size/large` and posts one comment when it changes
# more than 400 lines, to prompt splitting it against a plan (see CONTRIBUTING.md, "Change size").
# It never fails and is not a required check.
#
# Security: this runs on `pull_request_target` so it can write labels and comments on pull
# requests from forks. That is only safe because the job checks out the BASE branch (never the
# pull request's code) and talks to the GitHub API only. Do not add a checkout of the PR head or
# run anything from it.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] base-branch checkout and API only; see the note above
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: pr-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  size:
    name: PR size notice
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # check out the base branch
      pull-requests: write # add and remove the label
      issues: write # post and update the comment (pull requests are issues)
    steps:
      - name: Check out the base branch (not the pull request)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Label and comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          SIZE_THRESHOLD: "400"
        run: python3 .github/scripts/pr_size.py
