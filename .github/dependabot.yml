version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before adopting a brand-new release: gives the community time to spot a
    # compromised or broken version (supply-chain safety). Security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-dev:
        dependency-type: development
    commit-message:
      prefix: "deps"
