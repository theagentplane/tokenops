# See https://pre-commit.com
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^examples/config/
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      # Same scope as CI (`ruff check/format src tests examples`); benchmarking/ and
      # scripts/ are not linted there and would be reformatted on the newer ruff.
      - id: ruff
        args: ["--fix"]
        files: ^(src|tests|examples)/
      - id: ruff-format
        files: ^(src|tests|examples)/

  # Match CI / `make lint`: project mypy config from pyproject.toml.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: python -m mypy
        language: system
        pass_filenames: false
        types: [python]

  # Static analysis of .github/workflows (same check as the `zizmor` CI job).
  # Runs offline locally: no token is read; online-only audits are skipped.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
        args: ["--no-progress", "--offline"]
