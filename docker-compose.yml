# Control plane (+ optional Admin/Dashboard).
# Agent demos: docker-compose.examples.yml / docker-compose.triad.yml, or make demo / demo-triad.

services:
  tokenops:
    build: .
    command: ["python", "-m", "tokenops.server"]
    ports:
      - "7700:7700"
    environment:
      TOKENOPS_DB: /data/tokenops.db
      TOKENOPS_PORT: "7700"
      TOKENOPS_HOST: "0.0.0.0"
      TOKENOPS_CONFIG: src/tokenops/config/default.yaml
    volumes:
      - tokenops-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7700/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  ui:
    profiles: ["ui"]
    build: .
    command:
      [
        "streamlit",
        "run",
        "src/tokenops/ui/app.py",
        "--server.port=8501",
        "--server.address=0.0.0.0",
      ]
    ports:
      - "8501:8501"
    environment:
      TOKENOPS_DB: /data/tokenops.db
      TOKENOPS_URL: http://tokenops:7700
      TOKENOPS_CONFIG: src/tokenops/config/default.yaml
    volumes:
      - tokenops-data:/data
    depends_on:
      tokenops:
        condition: service_healthy

volumes:
  tokenops-data:
