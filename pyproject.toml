[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenops"
version = "0.1.0"
description = "TokenOps control plane with two-agent A2A test bench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "chronicle @ git+https://github.com/theagentplane/chronicle.git@f470f38fe5a16140e46805ee00a8128b3b014b28",
  "openai>=1.0",
  "anthropic>=0.40",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "streamlit>=1.30",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "ddgs>=9.0",
]

[project.optional-dependencies]
langchain = [
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "langchain-anthropic>=0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.setuptools.package-dir]
"" = "src"
"bench" = "bench"

[tool.setuptools.packages.find]
where = ["src", "."]
# Note: "bench*" would also match top-level "benchmarking/" — keep these exact.
include = ["tokenops*", "bench", "bench.*"]
