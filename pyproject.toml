[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenops"
version = "0.1.0"
description = "TokenOps control plane and SDK for run-aware agent token governance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "chronicle @ git+https://github.com/theagentplane/chronicle.git@f470f38fe5a16140e46805ee00a8128b3b014b28",
  "openai>=1.0",
  "anthropic>=0.40",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "streamlit>=1.30",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tokenops*"]
