[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tokenops"
version = "0.2.1"
description = "TokenOps control plane and SDK for run-aware agent token governance"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
  { name = "Susheem Koul" },
  { name = "Tisha Chawla" },
]
keywords = [
  "llm",
  "agents",
  "governance",
  "token-budget",
  "multi-agent",
  "control-plane",
  "cost-control",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "agent-chronicle>=0.3.0",
  "openai>=1.0",
  "anthropic>=0.40",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "streamlit>=1.38,<2",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "build>=1.2",
  "twine>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "pre-commit>=4.0",
  "types-PyYAML>=6.0",
]
examples = [
  "ddgs>=9.0",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "langchain-anthropic>=0.2",
]

[project.urls]
Homepage = "https://github.com/theagentplane/tokenops"
Repository = "https://github.com/theagentplane/tokenops"
Issues = "https://github.com/theagentplane/tokenops/issues"
Changelog = "https://github.com/theagentplane/tokenops/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "strict"
markers = [
  "e2e: example / bench end-to-end tests (not run in default CI)",
  "live: requires API keys or vendored frameworks",
]
addopts = "-m 'not e2e and not live'"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = [
  "E501",  # line length — formatter
  "E402",  # late imports (env load, optional deps, circular avoidance)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E731"]
"examples/**/*.py" = ["E731"]
"scripts/**/*.py" = ["T201"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["tokenops"]
ignore_missing_imports = true
warn_unused_configs = true
# Gradual typing: UI + adapters are Streamlit/LangChain-heavy; tighten later.
exclude = "(?x)(tokenops/ui/|tokenops/adapters/)"

# NumPy 2.x stubs use `type` statements (3.12+). With python_version=3.10 mypy cannot
# parse them when they appear as transitive deps on newer Pythons in CI.
[[tool.mypy.overrides]]
module = [
  "numpy",
  "numpy.*",
]
follow_imports = "skip"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tokenops*"]

# Ship the default governance YAML with the wheel (loader resolves via Path(__file__)).
[tool.setuptools.package-data]
tokenops = ["config/*.yaml"]
