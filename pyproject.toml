[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenops"
version = "0.1.0"
description = "Two-agent A2A test bench for research and summarize pipelines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0",
  "anthropic>=0.40",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "streamlit>=1.30",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "ddgs>=9.0",
]

[project.optional-dependencies]
langchain = [
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "langchain-anthropic>=0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
