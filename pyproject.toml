[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenops"
version = "0.1.0"
description = "TokenOps control plane and SDK for run-aware agent token governance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "agent-chronicle>=0.1.1",
  "openai>=1.0",
  "anthropic>=0.40",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "streamlit>=1.30",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
examples = [
  "ddgs>=9.0",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "langchain-anthropic>=0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "e2e: example / bench end-to-end tests (not run in default CI)",
  "live: requires API keys or vendored frameworks",
]
addopts = "-m 'not e2e and not live'"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tokenops*"]
