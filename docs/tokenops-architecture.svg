<svg viewBox="0 0 1000 716" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title>TokenOps external control plane with policy detail</title>
<desc>Out-of-band control, in-path enforcement. Policies steer the run; the circuit breaker halts it.</desc>
<defs>
<marker id="g" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 Z" fill="#475569"/></marker>
<marker id="b" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 Z" fill="#2563eb"/></marker>
<marker id="r" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 Z" fill="#dc2626"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="716" fill="#ffffff"/>
<text x="40" y="44" font-size="30" font-weight="800" fill="#0f172a">TokenOps · Control Plane</text>
<text x="40" y="68" font-size="13.5" fill="#64748b">Meter, attribute, and bound token spend across a multi agent run, from outside the agent.</text>
<circle cx="690" cy="34" r="6" fill="#2563eb"/><text x="703" y="39" font-size="12.5" font-weight="700" fill="#1d4ed8">steer</text>
<circle cx="768" cy="34" r="6" fill="#dc2626"/><text x="781" y="39" font-size="12.5" font-weight="700" fill="#b91c1c">halt</text>
<rect x="650" y="54" width="310" height="26" rx="13" fill="#eef2ff" stroke="#6366f1"/>
<text x="805" y="71" font-size="10.5" font-weight="700" letter-spacing="0.5" fill="#4338ca" text-anchor="middle">PATTERN · OUT-OF-BAND GUARDRAIL INTERCEPTION</text>

<rect x="40" y="90" width="920" height="96" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="56" y="111" font-size="11" letter-spacing="1.5" fill="#94a3b8">DATA PLANE · THE RUN (AGENTS UNCHANGED)</text>
<rect x="80" y="122" width="300" height="50" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="100" y="152" font-size="13.5" font-weight="600" fill="#1f2937">Agent A · research (OpenAI)</text>
<rect x="540" y="122" width="300" height="50" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="560" y="152" font-size="13.5" font-weight="600" fill="#1f2937">Agent B · summarize (Anthropic)</text>
<line x1="380" y1="147" x2="536" y2="147" stroke="#475569" stroke-width="1.5" marker-end="url(#g)"/>
<text x="458" y="139" font-size="11" fill="#475569" text-anchor="middle">delegate (A2A) · shared run_id</text>

<line x1="150" y1="186" x2="150" y2="244" stroke="#475569" stroke-width="1.5" marker-end="url(#g)"/>
<text x="162" y="208" font-size="12" font-weight="700" fill="#1f2937">emit (IN)</text>
<text x="162" y="224" font-size="10.5" fill="#475569">SDK hook · inline</text>
<line x1="915" y1="244" x2="915" y2="188" stroke="#475569" stroke-width="1.5" marker-end="url(#g)"/>
<text x="903" y="208" font-size="12" font-weight="700" fill="#1f2937" text-anchor="end">apply (OUT)</text>
<text x="903" y="224" font-size="10.5" fill="#475569" text-anchor="end">to the run · any agent</text>

<rect x="40" y="246" width="920" height="132" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="56" y="267" font-size="11" letter-spacing="1.5" fill="#94a3b8">CONTROL PLANE · EXTERNAL TO THE AGENT · IN-PATH ENFORCEMENT</text>
<rect x="80" y="282" width="240" height="80" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="100" y="314" font-size="16" font-weight="800" fill="#1f2937">1 · Instrument</text>
<text x="100" y="336" font-size="12.5" fill="#64748b">Measure &amp; Enrich</text>
<rect x="380" y="282" width="240" height="80" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="400" y="314" font-size="16" font-weight="800" fill="#1f2937">2 · Account</text>
<text x="400" y="336" font-size="12.5" fill="#64748b">Record &amp; Aggregate</text>
<rect x="680" y="282" width="240" height="80" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="700" y="314" font-size="16" font-weight="800" fill="#1f2937">3 · Enforce</text>
<text x="700" y="336" font-size="12.5" fill="#64748b">Decide &amp; Act</text>
<line x1="320" y1="322" x2="376" y2="322" stroke="#475569" stroke-width="1.5" marker-end="url(#g)"/>
<text x="348" y="314" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Event</text>
<line x1="620" y1="322" x2="676" y2="322" stroke="#475569" stroke-width="1.5" marker-end="url(#g)"/>
<text x="648" y="314" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">LedgerView</text>

<text x="500" y="398" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Enforce runs two mechanisms on every event</text>
<path d="M800,378 V408 H500 V424" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
<path d="M290,424 H710" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
<path d="M290,424 V456" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#b)"/>
<path d="M710,424 V456" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#r)"/>
<text x="300" y="446" font-size="11.5" font-weight="700" fill="#2563eb">policies</text>
<text x="700" y="446" font-size="11.5" font-weight="700" fill="#dc2626" text-anchor="end">circuit breaker</text>

<rect x="110" y="458" width="360" height="192" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="290" y="490" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">Policies · STEER</text>
<text x="290" y="512" font-size="12" fill="#2563eb" text-anchor="middle">configurable WHEN → THEN rules</text>
<text x="140" y="548" font-size="15" font-weight="700" fill="#1e3a8a">Repeated tool <tspan fill="#1d4ed8">→ REDIRECT</tspan></text>
<text x="140" y="580" font-size="15" font-weight="700" fill="#1e3a8a">Cost spiking <tspan fill="#1d4ed8">→ DOWNGRADE</tspan></text>
<text x="140" y="612" font-size="15" font-weight="700" fill="#1e3a8a">Near budget <tspan fill="#1d4ed8">→ THROTTLE</tspan></text>
<text x="290" y="638" font-size="11.5" font-style="italic" fill="#2563eb" text-anchor="middle">protects margin &amp; SLA · no mid-run crash</text>

<rect x="530" y="458" width="360" height="192" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="710" y="490" font-size="19" font-weight="800" fill="#b91c1c" text-anchor="middle">Circuit breaker · HALT</text>
<text x="710" y="512" font-size="12" fill="#dc2626" text-anchor="middle">fixed hard limits</text>
<text x="560" y="548" font-size="15" font-weight="700" fill="#7f1d1d">Over budget <tspan fill="#b91c1c">→ HALT</tspan></text>
<text x="560" y="580" font-size="15" font-weight="700" fill="#7f1d1d">Over step cap <tspan fill="#b91c1c">→ HALT</tspan></text>
<text x="560" y="612" font-size="15" font-weight="700" fill="#7f1d1d">Worst-case spend <tspan fill="#b91c1c">→ HALT</tspan></text>
<text x="710" y="638" font-size="11.5" font-style="italic" fill="#dc2626" text-anchor="middle">the only thing that stops a run</text>

<text x="500" y="676" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Policies steer the run.  Only the circuit breaker halts it.</text>
<text x="500" y="702" font-size="10.5" fill="#94a3b8" text-anchor="middle">Install: wrap the OpenAI / Anthropic client once. Inline interceptor; prompt chains &amp; agent graph untouched.</text>
</svg>
